{% extends "base.html" %}

{% block content %}

<h1>Talleres 2026</h1>

<div class="container-workshops">
    {% for w in workshops %}
    <div class="card">
        {% if w.image %}
        <div class="card-header" style="background-image: url('{{ w.image.url }}');">
            {% else %}
        <div class="card-header">
        {% endif %}
            <h2>{{ w.name }}</h2>
        </div>
        <div class="card-body">
            <p>{{ w.description }}</p>
            <p>{{ w.classroom }}</p>
            <p>{{ w.date }} - {{ w.start_time }}</p>
            <a href="">Detalles</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
