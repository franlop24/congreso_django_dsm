<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConTec 2026 | {% block title %}{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <img src="{% static 'images/logoitiid.png' %}" alt="Logo">
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'workshops:workshop_list' %}">Talleres</a>
            {% if not user.is_authenticated %}
            <a href="{% url 'login' %}">Login</a>
            <a href="">Registro</a>
            {% endif %}
        
        {% if user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn sm">Salir</button>
        </form>
        {% endif %}
        </nav>
    </header>
    <div class="container">
    {% block content %}
    {% endblock %}
    </div>
</body>
</html>
